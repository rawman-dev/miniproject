<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        margin: 0;
        padding: 0;
    }

    @keyframes gradientBG {
        0% {background-position: 0% 50%;}
        50% {background-position: 100% 50%;}
        100% {background-position: 0% 50%;}
    }
</style>
    <script>
        function calculateBMIIfReady() {
            let weightInput = document.getElementById('wt');
            let heightInput = document.getElementById('ht');
            let bmiOutput = document.getElementById('bmi');

            let weight = parseFloat(weightInput.value);
            let height = parseFloat(heightInput.value);

            if (!isNaN(weight) && !isNaN(height) && height > 0) {
                let bmi = weight / ((height / 100) ** 2);
                bmiOutput.value = bmi.toFixed(2);
            } else {
                bmiOutput.value = '';
            }
        }
         window.onload = function() {
    var myModal = new bootstrap.Modal(document.getElementById('predictionModal'));
    myModal.show();
  };
    </script>
  <!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap JS (required for modal) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card p-4 shadow-lg w-100" style="max-width: 500px;">
	<h1 class="text-center mb-4">Student Performance</h1>

    <form action="{{ url_for('predict')}}"method="post">
         <div class="mb-3">
              <label for="gender" class="form-label">Gender</label>
         <select name="gender"  class="form-select">
    <option value="Male">Male</option>
    <option value="Female">Female</option>
  </select>
         </div>
          <div class="mb-3">
               <label for="age" class="form-label">Age</label>
        <input type="number" name="age" placeholder="Age" class="form-control" required="required" />
          </div>
          <div class="mb-3">
              <label for="ht" class="form-label">Height (cm)</label>
        <input type="number" name="height" id="ht" placeholder="Height" class="form-control" oninput="calculateBMIIfReady()" required="required" />
          </div>
		  <div class="mb-3">
               <label for="wt" class="form-label">Weight (kg)</label>
              <input type="number" name="weight" id="wt" placeholder="Weight" class="form-control" oninput="calculateBMIIfReady()" required="required" />
          </div>
        <div class="mb-3">
             <label for="bmi" class="form-label">BMI</label>
        <input type="text" name="bmiw" id="bmi" placeholder="BMI" readonly class="form-control" required="required" />
        </div>
        <div class="mb-3">
              <label for="hl" class="form-label">Hours of Learning</label>
            <input type="text" name="hl" placeholder="Hours of Learning" class="form-control" required="required" />
        </div>
        <div class="mb-3">
             <label for="he" class="form-label">Hours of Extra Curricular</label>
        <input type="text" name="he" placeholder="Hours of Extra Curricular" class="form-control" required="required" />
        </div>
        <div class="mb-3">
            <label for="hs" class="form-label">Hours of Sleep</label>
            <input type="text" name="hs" placeholder="Hours of Sleep" class="form-control" required="required" />
        </div>
         <div class="mb-4">
              <label for="chat" class="form-label">Do you ChatGPT frequently?</label>
            <select name="chat" class="form-select">
    <option value="Yes">Yes</option>
    <option value="No">No</option>
  </select>
        <button type="submit" class="btn btn-primary btn-block btn-large">Predict</button>
    </form>

   <br>
   <br>
   <div class="modal fade" id="predictionModal" tabindex="-1" aria-labelledby="predictionModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="predictionModalLabel">Prediction Result</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body fw-bold fs-1 text-success" id="predi">
        {{ prediction_text }}
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-large" data-bs-dismiss="modal">Close</button>
      </div>

    </div>
  </div>
</div>

 </div>

</body>
</html>
